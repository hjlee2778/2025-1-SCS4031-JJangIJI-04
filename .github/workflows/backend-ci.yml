name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
    branches: [ "dev" , "main", "dev-be"]
  push:
    paths:
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-cd.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: ./backend/hankkimoa
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 세팅
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper 실행 권한 추가
        run: chmod +x gradlew
        
      - name: Write application.yml
        env:
          APPLICATION_YML: ${{ secrets.APPLICATION_YML }}
          APPLICATION_TEST_YML: ${{ secrets.APPLICATION_TEST_YML }}
      
        run: |
          mkdir -p src/test/resources
          echo "${APPLICATION_YML}" > src/test/resources/application.yml
          echo "${APPLICATION_TEST_YML}" > src/test/resources/application-test.yml

      - name: Gradle 빌드
        run: ./gradlew clean build
