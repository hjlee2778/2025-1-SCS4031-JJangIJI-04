server {
    listen 80;
    server_name api.hankkimoa.click;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.hankkimoa.click;

    ssl_certificate /etc/letsencrypt/live/api.hankkimoa.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hankkimoa.click/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
